<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Welcome to ForgeVerse</title>
		<meta
			name="description"
			content="Sign in or create an account to access ForgeVerse — your interactive storytelling platform."
		/>
		<link rel="stylesheet" href="https://localhost:8080/css/global.css" />
		<link rel="stylesheet" href="https://localhost:8080/css/auth.css" />
	</head>
	<body>
		<div class="toast-container" id="toastContainer"></div>

		<div class="auth-page">
			<div class="auth-hero" id="authHero">
				<div class="hero-particles" id="heroParticles"></div>
				<div class="hero-overlay"></div>
				<div class="hero-content">
					<div class="hero-logo" id="hero-logoid">
						<div class="logo-icon">
							<svg width="48" height="48" viewBox="0 0 48 48" fill="none">
								<defs>
									<linearGradient
										id="logoGrad"
										x1="0%"
										y1="0%"
										x2="100%"
										y2="100%"
									>
										<stop offset="0%" stop-color="#a78bfa" />
										<stop offset="100%" stop-color="#6366f1" />
									</linearGradient>
								</defs>
								<path
									d="M24 4L6 14v20l18 10 18-10V14L24 4z"
									fill="url(#logoGrad)"
									opacity="0.2"
								/>
								<path
									d="M24 4L6 14v20l18 10 18-10V14L24 4z"
									stroke="url(#logoGrad)"
									stroke-width="2"
									fill="none"
								/>
								<path
									d="M16 20h16M16 24h12M16 28h8"
									stroke="#a78bfa"
									stroke-width="2"
									stroke-linecap="round"
								/>
							</svg>
						</div>
						<div class="logo-text">
							<h1>ForgeVerse</h1>
						</div>
					</div>
					<p class="hero-tagline">Where Imagination Becomes Reality</p>
					<p class="hero-description">
						Create, explore, and experience stories like never before.
					</p>

					<div class="auth-card glass-strong">
						<div class="auth-welcome" id="authWelcome">
							<h2 id="welcomeTitle">Hello, {{printf .Name}}!</h2>
							<p id="welcomeSubtitle">
								Choose a unique username for your account
							</p>
						</div>

						<form class="auth-form" id="registerForm" novalidate>
							<div class="input-group">
								<label class="input-label" for="regUsername">Username</label>
								<div class="input-icon-wrapper">
									<input
										type="text"
										id="regUsername"
										class="input-field"
										placeholder="Choose a username"
										autocomplete="username"
									/>
									<span class="icon-left">👤</span>
								</div>

								<ul class="input-error" id="usernameErrors"></ul>
							</div>

							<button
								type="button"
								class="btn btn-primary auth-submit"
								id="registerSubmit"
							>
								<span class="btn-text">Create Account</span>
							</button>
						</form>
					</div>

					<div class="hero-features">
						<div class="hero-feature">
							<span class="feature-icon">⚡</span>
							<span>Interactive Scene Editor</span>
						</div>
						<div class="hero-feature">
							<span class="feature-icon">🌟</span>
							<span>Visual Story Graphs</span>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="https://localhost:8080/scripts/createuser.js"></script>
	</body>
</html>
