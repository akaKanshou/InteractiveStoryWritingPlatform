<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Create User</title>
	</head>
	<body>
		<h1>"Welcome to ISWP!"</h1>

		<form action="/" method="post">
			<label for="username">Enter the username:</label>
			<input type="text" id="username" name="username" />
			<p>Pick a unique username for your url</p>

			<label for="displayname">Enter your display name:</label>
			<input type="text" id="displayname" name="displayname" />
			<p>What do you want to be called publically?</p>

			<input type="submit" value="Create user" />
		</form>

		<p id="errBox" hidden>
			Print here in case of error, otherwise it stays disabled
		</p>
	</body>
</html>
