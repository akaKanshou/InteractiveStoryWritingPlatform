<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Create User</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
		<link href="css/login.css" rel="stylesheet" />
	</head>
	<body>
		<header class="p-4 text-bg-dark shadow-lg" id="topheader">
			<div class="container">
				<div
					class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"
				>
					<a
						href="/"
						class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"
					>
						<img
							id="HeaderLogo"
							class="bi me-4 filterWhite"
							height="40"
							aria-label="ForgeVerse"
							alt="ForgeVerse Logo"
							src="images/noun-game-ui-anvil-forge-2360111.svg"
						/>
					</a>
					<ul
						class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"
					>
						<li><a href="/" class="nav-link px-2 text-secondary">Home</a></li>
						<li>
							<a href="/explore" class="nav-link px-2 text-white">Explore</a>
						</li>
						<li><a href="/write" class="nav-link px-2 text-white">Write</a></li>
					</ul>
					<form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
						<input
							type="search"
							class="form-control form-control-dark text-bg-dark"
							placeholder="Search..."
							aria-label="Search"
						/>
					</form>
					<div class="text-end">
						<button
							type="button"
							class="btn btn-outline-light me-2"
							onclick="sendTo('https://localhost:8080/login')"
						>
							Login
						</button>
					</div>
				</div>
			</div>
		</header>

		<main
			class="form-signin w-100 m-auto d-flex justify-content-around flex-row text-center my-5"
		>
			<form class="d-flex flex-column align-items-center rounded-4 py-4 my-4">
				<img
					class="mb-4 filterWhite"
					src="images/noun-game-ui-anvil-forge-2360111.svg"
					alt=""
					height="80"
				/>
				<h1 class="h3 mb-3 fw-normal">Sign In</h1>

				<button
					id="sign-in-btn"
					class="btn border border-dark-subtle p-2"
					type="reset"
				>
					<img
						src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg"
						class="ps-2 pe-1"
					/><span id="sign-in-txt" class="pe-2"> Sign in with Google </span>
				</button>

				<div class="form-check text-start my-3">
					<input
						class="form-check-input border border-dark-subtle"
						type="checkbox"
						value="off"
						id="checkRememberMe"
					/>
					<label class="form-check-label" for="checkRememberMe">
						Remember me
					</label>
				</div>
			</form>
		</main>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"
		></script>

		<script src="scripts/login.js"></script>
	</body>
</html>
