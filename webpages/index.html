<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login</title>
		<style>
			form {
				justify-self: center;
			}

			body {
				background-color: #222222;
			}

			body * {
				font-family: "JetBrainsMono Nerd Font", monospace !important;
			}

			.btn,
			input,
			label,
			select {
				display: block;
				margin: 50px auto;
				background-color: cornflowerblue;
				border: none;
				border-radius: 10px;
				padding: 10px 15px;
				width: fit-content;
			}

			input,
			label,
			select {
				display: inline;
				color: white;
				margin: 20px;
			}

			.result {
				color: white;
			}

			a {
				color: white;
				text-decoration: none;
				font-size: 20px;
				font-weight: 500;
			}

			.editorContainer {
				background: white;
				height: fit-content;
				width: 60%;
				justify-self: center;
				border-radius: 50px;
				padding-top: 30px
			}


			#editorjs {
				height: fit-content;
			}
		</style>
	</head>
	<body>
		<p style="color: white">Hello {{printf .Username}}</p>
		<main>
			<button class="btn">
				<a href="auth/login">Login</a>
			</button>

			<form>
				<label for="storyname">Story name: </label>
				<input type="text" id="storyname" />
				<label for="storydesc">Story description: </label>
				<input type="text" id="storydesc" />
				<label for="visibility">Visibility: </label>
				<select id="visibility">
					<option value="private" selected>Private</option>
					<option value="public">Public</option>
				</select>
				<label for="forkable">Forkable: </label>
				<select id="forkable">
					<option value="false" selected>False</option>
					<option value="true">True</option>
				</select>

				<label for="storyid">Story ID: </label>
				<input type="text" id="storyid" />

				<div class="result" id="storyresult"></div>
				<button type="button" onclick="createStory()" class="btn">
					<a>Create story</a>
				</button>

				<button type="button" onclick="editStory()" class="btn">
					<a>Edit story</a>
				</button>
			</form>

			<form>
				<label for="username">Username: </label>
				<input type="text" id="username" />
				<label for="getPrivacy">Privacy</label>
				<select id="getPrivacy">
					<option value="private" selected>Private</option>
					<option value="public">Public</option>
					<option value="all">All</option>
				</select>

				<button type="button" onclick="getStories()" class="btn">
					<a>Get stories</a>
				</button>

				<div class="result" id="stories"></div>
			</form>

			<form>
				<label for="chaptername">Chapter name: </label>
				<input type="text" id="chaptername" />

				<label for="storyofchapter">Story ID: </label>
				<input type="text" id="storyofchapter" />

				<div class="result" id="chapterresult"></div>
				<button type="button" onclick="createChapter()" class="btn">
					<a>Create chapter</a>
				</button>

				<label for="chapterid">Chapter id:</label>
				<input type="text" id="chapterid" />

				<button type="button" onclick="editChapter()" class="btn">
					<a>Edit chapter</a>
				</button>
			</form>

			<div class="editorContainer">
				<div id="editorjs"></div>
			</div>

			<form>
				<label for="storyid2">Story ID: </label>
				<input type="text" id="storyid2" />

				<label for="chapterid2">Chapter id:</label>
				<input type="text" id="chapterid2" />

				<div class="result" id="chapterresult2"></div>

				<button type="button" class="btn" onclick="getStoryChapters()"><a>Get all chapters of
					story</a></button>
				<button type="button" class="btn" onclick="getChapter()"><a>Get chapter</a></button>

				<div class="editorContainer">
					<div id="outputjs"></div>
				</div>
			</form>

			<form>
				<label for="fromChapter">From chapter:</label>
				<input id="fromChapter" type="text" />

				<label for="toChapter">To chapter:</label>
				<input id="toChapter" type="text" />

				<label for="chapterid3">Chapter id:</label>
				<input type="text" id="chapterid3" />

				<div class="result" id="edgeresult"></div>

				<button type="button" class="btn" onclick="addEdge()">
					<a>
						Add edge
					</a>
				</button>

				<button type="button" class="btn" onclick="getEdges()">
					<a>
					Get edges
					</a>
				</button>

			</form>
		</main>


		<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
		<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
		<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>

		<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>

		<script>
			let editor = new EditorJS({
				readOnly: false,
				holder: "editorjs",
				tools: {
					header: {
						class: Header,
						inlineToolbar: ["italic", "bold"],
						config: {
							placeholder: "Heading",
							levels: [2, 3, 4],
							defaultLevel: 3,
						},
						shortcut: "CMD+SHIFT+H",
					},

					quote: {
						class: Quote,
						inlineToolbar: true,
						config: {
							quotePlaceholder: "Enter a quote",
							captionPlaceholder: "Quote's author",
						},
						shortcut: "CMD+SHIFT+O",
					},

					delimiter: Delimiter,
				},

				defaultBlock: "paragraph",

				onReady: function () {
					console.log("EditorJS is ready");
				},

				onChange: function (api, event) {
					console.log("something changed");
					console.log(api);
					console.log(event);
				},

				data: {
					blocks: [
						{
							type: "header",
							data: {
								text: "Editor.js",
								level: 2,
							},
						},

						{
							type: "paragraph",
							data: {
								text: "Hey. Meet the new Editor. On this page you can see it in action — try to edit this text. Source code of the page contains the example of connection and configuration.",
							},
						},
					],
				},
			});
		</script>

		<script>
			document
				.getElementById("editorjs")
				.addEventListener("keydown", (event) => {
					if (event.ctrlKey && event.key === "s") {
						event.preventDefault();
						showOutput();
					}
				});
		</script>

		<script>
			async function createStory() {
				const sname = document.getElementById("storyname").value;
				const sdesc = document.getElementById("storydesc").value;
				const visb = document.getElementById("visibility").value;
				const forkable = document.getElementById("forkable").value;

				const formdata = new FormData();
				formdata.append("story_name", sname);
				formdata.append("description", sdesc);
				formdata.append("visibility", visb);
				formdata.append("forkable", forkable);

				const req = new Request("https://localhost:8080/api/newstory", {
					method: "POST",
					body: formdata,
				});

				const resp = await fetch(req);
				document.getElementById("storyresult").textContent = await resp.text();
			}
		</script>

		<script>
			async function getStories() {
				const uname = document.getElementById("username").value;
				const getvs = document.getElementById("getPrivacy").value;
				const req = new Request(
					`https://localhost:8080/api/getstories/${uname}?visibility=${getvs}`,
					{ method: "GET" }
				);

				const resp = await fetch(req);
				const jsonRes = await resp.json()

				if (resp.status === 200) {
					document.getElementById("stories").textContent = JSON.stringify(jsonRes);
				} else {
					document.getElementById("stories").textContent = jsonRes.message;
				}
			}
		</script>

		<script>
			async function editStory() {
				const sname = document.getElementById("storyname").value;
				const sdesc = document.getElementById("storydesc").value;
				const visb = document.getElementById("visibility").value;
				const storyid = document.getElementById("storyid").value;
				const forkable = document.getElementById("forkable").value;

				const formdata = new FormData();
				formdata.append("story_name", sname);
				formdata.append("description", sdesc);
				formdata.append("visibility", visb);
				formdata.append("story_id", storyid);
				formdata.append("forkable", forkable);

				const req = new Request("https://localhost:8080/api/editstory", {
					method: "POST",
					body: formdata,
				});

				const resp = await fetch(req);
				const jsonRes = await resp.json()
				document.getElementById("chapterresult2").textContent = JSON.stringify(jsonRes);
			}
		</script>

		<script>
			async function createChapter() {
				const chaptername = document.getElementById("chaptername").value
				const storyofchapter = document.getElementById("storyofchapter").value

				const chaptercontent = await editor
						.save()
						.then((savedData) => {
							console.log(savedData);
							return JSON.stringify(savedData)
						})
						.catch((error) => {
							console.error("Saving error", error);
							return ""
						});

				const formdata = new FormData();
				formdata.append("chapter_name", chaptername);
				formdata.append("story_id", storyofchapter);
				formdata.append("content", chaptercontent);

				const req = new Request("https://localhost:8080/api/newchapter", {
					method: "POST",
					body: formdata,
				});

				const resp = await fetch(req);
				const jsonRes = await resp.json()
				document.getElementById("chapterresult2").textContent = JSON.stringify(jsonRes);
			}
		</script>

		<script>
			async function editChapter() {
				const chaptername = document.getElementById("chaptername").value
				const chapterid = document.getElementById("chapterid").value

				const chaptercontent = await editor
						.save()
						.then((savedData) => {
							console.log(savedData);
							return JSON.stringify(savedData)
						})
						.catch((error) => {
							console.error("Saving error", error);
							return ""
						});

				const formdata = new FormData();
				formdata.append("chapter_name", chaptername);
				formdata.append("chapter_id", chapterid);
				formdata.append("content", chaptercontent);

				const req = new Request("https://localhost:8080/api/editchapter", {
					method: "POST",
					body: formdata,
				});

				const resp = await fetch(req);
				const jsonRes = await resp.json()
				document.getElementById("chapterresult2").textContent = JSON.stringify(jsonRes);
			}
		</script>

		<script>
			var outputJS = null

			async function getStoryChapters() {
				const storyid = document.getElementById("storyid2").value

				const req = new Request(`https://localhost:8080/api/getstorychapters/${storyid}`, {
					method: "GET",
				});

				const resp = await fetch(req);
				const jsonRes = await resp.json()
				document.getElementById("chapterresult2").textContent = JSON.stringify(jsonRes);
			}

			async function getChapter() {
				const chapterid = document.getElementById("chapterid2").value

				const req = new Request(`https://localhost:8080/api/getchapter/${chapterid}`, {
					method: "GET",
				});

				const resp = await fetch(req);
				const resultvalue = await resp.json();

				if (resp.status === 200) {
					if (outputJS != null) {
						outputJS.destroy()
					}

					outputJS = new EditorJS({
						readOnly: true,
						holder: "outputjs",

						tools: {
							header: {
								class: Header,
								inlineToolbar: ["italic", "bold"],
								config: {
									placeholder: "Heading",
									levels: [2, 3, 4],
									defaultLevel: 3,
								},
								shortcut: "CMD+SHIFT+H",
							},

							quote: {
								class: Quote,
								inlineToolbar: true,
								config: {
									quotePlaceholder: "Enter a quote",
									captionPlaceholder: "Quote's author",
								},
								shortcut: "CMD+SHIFT+O",
							},

							delimiter: Delimiter,
						},

						onReady: function () {
							console.log("EditorJS is ready");
						},

						data: JSON.parse(resultvalue.chapter.content)
					})

					document.getElementById("chapterresult2").textContent = resultvalue.chapter.chapter_name
				} else {
					console.log(resultvalue)
				}
			}
		</script>

		<script>
			async function addEdge() {
				const from = document.getElementById("fromChapter").value
				const to = document.getElementById("toChapter").value

				const formdata = new FormData()
				formdata.append("from_chapter", from)
				formdata.append("to_chapter", to)

				const req = new Request("https://localhost:8080/api/addedge", {
					method: "POST",
					body: formdata
				})

				const res = await fetch(req)
				const jsonRes = await res.json()
				document.getElementById("chapterresult2").textContent = JSON.stringify(jsonRes);
			}

			async function getEdges() {
				const chapid = document.getElementById("chapterid3").value

				const req = new Request(`https://localhost:8080/api/getedges/${chapid}`, {
					method: "GET",
				})

				const res = await fetch(req)
				const jsonRes = await res.json()
				document.getElementById("chapterresult2").textContent = JSON.stringify(jsonRes);
			}
		</script>
	</body>
</html>
