<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New Chapter</title>
        <link rel="stylesheet" href="https://localhost:8080/css/newchapter.css">
    </head>
    <body>
        <div class="main">
            <div class="row">
                <h1>Write a Chapter</h1>
            </div>
            <div class="row">
                <div class="rowElem">
                    <label for="chapterNameTextInput">Chapter Name:</label>
                    <input type="text" id="chapterNameTextInput" placeholder="Chapter Name"/>
                </div>
                <div class="rowElem">
                    <label for="storyIDTextInput">Story ID:</label>
                    <input type="text" id="storyIDTextInput" placeholder="Story ID"/>
                </div>
            </div>
            <div class="row justifyCenter" id="editorJSRow">
                <div class="editorContainer">
                    <div id="editorJS"></div>
                </div>
            </div>
            <div class="row">
                <div class="rowElem">
                    <label for="edgesIncoming">Chapter IDs leading to this chapter (comma separated): </label>
                    <input type="text" id="edgesIncoming" placeholder="XYZ,ABC"/>
                </div>
            </div>

            <div class="row">
                <div class="rowElem">
                    <label for="edgesOutgoing">Chapter IDs this chapter leads to (comma separated): </label>
                    <input type="text" id="edgesOutgoing" placeholder="XYZ,ABC"/>
                </div>
            </div>
            <div class="row">
                <div class="rowElem">
                    <label for="chapterNumNumberInput">Chapter Number:</label>
                    <input type="number" id="chapterNumNumberInput" placeholder="Chapter Number"/>
                </div>
                <div class="rowElem Width50">
                    <div class="flexCenter">
                        <button id="submit">Submit</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>

        <script src="https://localhost:8080/scripts/newchapter.js"></script>
    </body>
</html>
