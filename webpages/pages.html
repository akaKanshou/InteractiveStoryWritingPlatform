<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pages</title>
    <style>
        form {
            justify-self: center;
        }

        body {
            background-color: #222222;
        }

        body * {
            font-family: "JetBrainsMono Nerd Font", monospace !important;
        }

        .btn,
        input,
        label,
        select {
            display: block;
            margin: 50px auto;
            background-color: cornflowerblue;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            width: fit-content;
        }

        input,
        label,
        select {
            display: inline;
            color: white;
            margin: 20px;
        }

        .result {
            color: white;
        }

        a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<main>
    <button class="btn">
        <a href="auth/login">Login</a>
    </button>

    <button class="btn">
        <a href="/index">Api examples index</a>
    </button>

    <button class="btn">
        <a href="/home">Homepage</a>
    </button>

    <button class="btn">
        <a href="https://localhost:8080/user">User stories</a>
    </button>
</main>

</body>
</html>
