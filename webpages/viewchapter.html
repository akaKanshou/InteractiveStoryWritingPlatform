<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{.ChapterInfo.Content}}</title>
        <link rel="stylesheet" href="https://localhost:8080/css/viewchapter.css">
    </head>
    <body>
        <div class="main">
            <div class="row flexColumn">
                <h2>Chapter {{.ChapterInfo.Index}}</h2>
                <h1>{{.ChapterInfo.ChapterName}}</h1>
            </div>
            <div class="row">
                <div class="rowElem">
                    {{.LastUpdatedDate}}
                </div>
                <div class="rowElem">
                    @{{.ChapterInfo.Username}}
                </div>
            </div>
            <div class="row justifyCenter">
                <div class="editorContainer">
                    <div id="editorJS" data-id={{.ChapterInfo.ChapterID}}></div>
                </div>
            </div>

            <div class="row" id="outgoingEdges">

            </div>

            <div class="row" id="incomingEdges">

            </div>

            <div class="row" id="outgoingForks">

            </div>

            <div class="row" id="incomingForks">

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>

        <script src="https://localhost:8080/scripts/viewchapter.js"></script>
    </body>
</html>
