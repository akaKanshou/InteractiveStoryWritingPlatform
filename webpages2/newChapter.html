<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New Chapter</title>

        <link rel="stylesheet" href="https://localhost:8080/css/index.css">
        <link rel="stylesheet" href="https://localhost:8080/css/newchapter.css">

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>

    <body>

        <div id="hamburger">
            <div class="hamRows" id="hamburgerRow1"></div>
            <div class="hamRows" id="hamburgerRow2"></div>
            <div class="hamRows" id="hamburgerRow3"></div>
        </div>

        <nav>
            <div id="logo_text">
                <div id="logo">
                    <img src="https://localhost:8080/images/logo.svg" alt="LOGO">
                </div>

                <div id="text">ForgeVerse</div>
            </div>

            <ul>
                <li>
                    <a href="https://localhost:8080/">
                        <i class="fa-solid fa-house-chimney"></i>
                        <span>Home</span>
                    </a>
                </li>

                <li>
                    <a href="https://localhost:8080/user/mystories">
                        <i class="fa-solid fa-pen-nib"></i>
                        <span>My Stories</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div id="mainPage">

            {{template "headerTempl" .}}

            <main class="main">

                <header class="pageHeader">
                    <h1>Write a Chapter</h1>
                    <p>Add a new chapter to your story.</p>
                </header>

                <div class="chapterDetails">

                    <div class="rowElem">
                        <label for="chapterNameTextInput">
                            Chapter Name
                        </label>

                        <input
                            type="text"
                            id="chapterNameTextInput"
                            placeholder="Chapter Name">
                    </div>

                    <div class="rowElem">
                        <label for="storyIDTextInput">
                            Story ID
                        </label>

                        <input
                            type="text"
                            id="storyIDTextInput"
                            placeholder="Story ID"
                            value="Loading..."
                            disabled>
                    </div>

                </div>

                <div class="editorRow" id="editorJSRow">
                    <div class="editorContainer">
                        <div id="editorJS"></div>
                    </div>
                </div>

                <div class="rowElem fullWidth">
                    <label for="edgesIncoming">
                        Chapter IDs leading to this chapter
                    </label>

                    <input
                        type="text"
                        id="edgesIncoming"
                        placeholder="XYZ, ABC">
                </div>

                <div class="rowElem fullWidth">
                    <label for="edgesOutgoing">
                        Chapter IDs this chapter leads to
                    </label>

                    <input
                        type="text"
                        id="edgesOutgoing"
                        placeholder="XYZ, ABC">
                </div>

                <div class="chapterBottom">

                    <div class="rowElem">
                        <label for="chapterNumNumberInput">
                            Chapter Number
                        </label>

                        <input
                            type="number"
                            id="chapterNumNumberInput"
                            placeholder="Chapter Number">
                    </div>

                    <button id="submit">
                        Submit
                    </button>

                </div>

            </main>

        </div>



        <script
            src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>

        <script src="https://localhost:8080/scripts/newchapter.js"></script>

    </body>

</html>
